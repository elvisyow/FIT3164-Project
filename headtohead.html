<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis Elo — Head‑to‑Head</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="assets/app.js" type="module" defer></script>
</head>
<body data-page="h2h">
  <header class="site-header">
    <a class="brand" href="homepage.html"> Home </a>
    <nav class="nav">
      <a href="rankings.html">Rankings</a>
      <a aria-current="page" href="headtohead.html">Head‑to‑Head</a>
      <a href="comparisons.html">Comparisons</a>
    </nav>
  </header>

  <main class="container center">
    <section class="hero">
      <h1 class="h1">Head to Head</h1>
      <p class="muted">Choose two players to match head to head.</p>
    </section>

    <section class="card" aria-labelledby="h2-players">
      <h2 id="h2-players" class="h2">Head-to-Head Search</h2>
      <form class="filters">
        <label>Player 1
          <input name="p1" list="players" placeholder="e.g., Rafael Nadal" />
        </label>
        <label>Player 2
          <input name="p2" list="players" placeholder="e.g., Novak Djokovic" />
        </label>
        <datalist id="players">
          <option value="Rafael Nadal"></option>
          <option value="Novak Djokovic"></option>
          <option value="Roger Federer"></option>
          <option value="Jannik Sinner"></option>
          <option value="Carlos Alcaraz"></option>
        </datalist>
        <button class="btn" type="submit">Predict</button>
      </form>
    </section>

    <section class="grid two">
      <div class="card">
        <h2 class="h2">Win probability</h2>
        <div class="prob">
          <div>
            <strong id="p1-name">Player A</strong>
            <div id="p1-prob" class="prob-num">—</div>
          </div>
          <div>
            <strong id="p2-name">Player B</strong>
            <div id="p2-prob" class="prob-num">—</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2 class="h2">Elo over time</h2>
        <canvas id="h2hChart" height="240" aria-label="Head to head Elo chart" role="img"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
