<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis Elo — Head-to-Head</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body data-page="h2h">
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Home</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('rankings') }}">Rankings</a>
      <a href="{{ url_for('headtohead') }}">Head-to-Head</a>
      <a href="{{ url_for('comparisons') }}">Comparisons</a>
    </nav>
  </header>

  <main class="container center">

    <!-- Hero Section -->
    <section class="hero">
      <h1 class="h1">Head to Head</h1>
      <p class="muted">Choose two players to match head to head.</p>
    </section>

    <!-- Head-to-Head Search -->
    <section class="card" aria-labelledby="h2-players">
      <h2 id="h2-players" class="h2">Head-to-Head Search</h2>
      <form class="filters" id="predict-form" onsubmit="return false;">
        <label>Player 1
          <input name="p1" list="players" placeholder="e.g., Nadal R." />
        </label>
        <label>Player 2
          <input name="p2" list="players" placeholder="e.g., Federer R." />
        </label>
        <datalist id="players">
          {% for name in players %}
            <option value="{{ name }}"></option>
          {% endfor %}
        </datalist>
        <button class="btn" id="load-btn" type="button">Load Player Timeline</button>
      </form>

      <!-- Slider -->
      <div style="margin-top: 1rem; max-width: 300px; margin-left:auto; margin-right:auto; text-align:center;">
        <label for="time-slider" style="display:block; margin-bottom:0.3rem;">Timeline Range</label>
        <input type="range" id="time-slider" min="0" max="100" value="100" style="width:100%;">
      </div>

      <div id="player-timeline-result" style="margin-top: 1rem;">
        <canvas id="eloChart" height="300"></canvas>
      </div>
    </section>

    <!-- Win Probability -->
    <section class="card" aria-labelledby="winprob-now-heading">
      <h2 id="winprob-now-heading" class="h2">Win Probability (Current Match)</h2>

      <div class="prob" style="display:flex; justify-content:space-around; margin-top:1rem;">
        <div>
          <strong id="p1-name">Player A</strong>
          <div id="p1-prob" class="prob-num">—</div>
        </div>
        <div>
          <strong id="p2-name">Player B</strong>
          <div id="p2-prob" class="prob-num">—</div>
        </div>
      </div>

      <canvas id="probChart" height="300" style="margin-top:2rem;"></canvas>

      <p id="prediction-result" style="text-align:center; font-weight:600; font-size:1.1rem; margin-top:1rem;"></p>
    </section>

    <!-- Win Probability Over Time -->
    <section class="card" aria-labelledby="winprob-time-heading">
      <h2 id="winprob-time-heading" class="h2">Win Probability Over Time</h2>
      <canvas id="probOverTimeChart" height="260"></canvas>
    </section>
  </main>

<script>
let eloChart = null;
let timelineData1 = [];
let timelineData2 = [];
let allDates = [];
let probOverTimeChart = null;

document.getElementById("load-btn").addEventListener("click", async () => {
  const player1 = document.querySelector('input[name="p1"]').value;
  const player2 = document.querySelector('input[name="p2"]').value;
  if (!player1 || !player2) return alert("Select both players");

  const res1 = await fetch(`/get_elo_history?player=${encodeURIComponent(player1)}`);
  const data1 = await res1.json();
  if (data1.error) { alert(data1.error); return; }

  const res2 = await fetch(`/get_elo_history?player=${encodeURIComponent(player2)}`);
  const data2 = await res2.json();
  if (data2.error) { alert(data2.error); return; }

  timelineData1 = data1;
  timelineData2 = data2;

  allDates = Array.from(new Set([...data1.map(d => d.date), ...data2.map(d => d.date)]));
  allDates.sort();

  updateChart(100);
  predictAndRender(player1, player2);
  updateProbOverTimeModel(100);  
});

document.getElementById("time-slider").addEventListener("input", async (e) => {
  const percent = e.target.value;
  updateChart(percent);
  updateProbOverTimeModel(percent); 
});

function updateChart(percent) {
  if (!timelineData1.length || !timelineData2.length) return;

  let count = Math.floor(allDates.length * percent / 100);
  const visibleDates = count > 0 ? allDates.slice(-count) : [];

  let lastElo1 = null;
  let lastElo2 = null;

  const elos1 = visibleDates.map(d => {
    const found = timelineData1.find(p => p.date === d);
    if (found && found.elo !== null && found.elo !== undefined) {
      lastElo1 = found.elo;
      return found.elo;
    }
    return lastElo1;
  });

  const elos2 = visibleDates.map(d => {
    const found = timelineData2.find(p => p.date === d);
    if (found && found.elo !== null && found.elo !== undefined) {
      lastElo2 = found.elo;
      return found.elo;
    }
    return lastElo2;
  });

  const ctx = document.getElementById('eloChart').getContext('2d');
  if (eloChart) eloChart.destroy();

  eloChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: visibleDates,
      datasets: [
        { 
          label: document.querySelector('input[name="p1"]').value + " Elo", 
          data: elos1, 
          borderColor: '#2ecc71', 
          backgroundColor: 'rgba(46, 204, 113, 0.1)', 
          tension: 0.2 
        },
        { 
          label: document.querySelector('input[name="p2"]').value + " Elo", 
          data: elos2, 
          borderColor: '#555555', 
          backgroundColor: 'rgba(85, 85, 85, 0.1)', 
          tension: 0.2 
        }
      ]
    },
    options: {
      scales: {
        y: { beginAtZero: false, title: { display: true, text: 'Elo Rating' } },
        x: { title: { display: true, text: 'Date' } }
      }
    }
  });
}

async function predictAndRender(p1, p2) {
  const body = { p1, p2, surface: "", round: "" };

  const res = await fetch("/api/predict", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  document.getElementById("p1-name").textContent = `${data.p1} (Elo ${data.p1_elo})`;
  document.getElementById("p2-name").textContent = `${data.p2} (Elo ${data.p2_elo})`;

  const p1pct = (data.prob_p1_wins * 100).toFixed(2);
  const p2pct = (100 - p1pct).toFixed(2);
  document.getElementById("p1-prob").textContent = `${p1pct}%`;
  document.getElementById("p2-prob").textContent = `${p2pct}%`;

  const ctx2 = document.getElementById("probChart").getContext("2d");
  if (window.probChart) window.probChart.destroy();
  window.probChart = new Chart(ctx2, {
    type: "doughnut",
    data: {
      labels: [data.p1, data.p2],
      datasets: [{ data: [p1pct, p2pct] }]
    },
    options: {
      plugins: {
        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.parsed}%` } },
        title: { display: true, text: `Predicted winner: ${data.predicted_winner}` }
      }
    }
  });

  document.getElementById("prediction-result").textContent =
    `Predicted winner: ${data.predicted_winner}`;
}

async function updateProbOverTimeModel(percent) {
  if (!timelineData1.length || !timelineData2.length) return;

  const count = Math.floor(allDates.length * percent / 100);
  const visibleDates = count > 0 ? allDates.slice(-count) : [];
  if (!visibleDates.length) return;

  let lastA = null, lastB = null;
  const allPoints = [];
  for (const d of visibleDates) {
    const a = timelineData1.find(p => p.date === d);
    const b = timelineData2.find(p => p.date === d);
    if (a && a.elo != null) lastA = Number(a.elo);
    if (b && b.elo != null) lastB = Number(b.elo);
    if (lastA != null && lastB != null) {
      allPoints.push({ date: d, elo_diff: lastA - lastB, surface: "", round: "" });
    }
  }

  if (!allPoints.length) {
    if (probOverTimeChart) { probOverTimeChart.destroy(); probOverTimeChart = null; }
    return;
  }

  const byYear = new Map();
  for (const pt of allPoints) {
    const yr = new Date(pt.date).getFullYear();
    byYear.set(yr, pt);
  }

  const years = Array.from(byYear.keys()).sort((a,b)=>a-b);
  const points = years.map(y => byYear.get(y));
  if (!points.length) return;

  const res = await fetch("/api/predict_series", {
    method: "POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ points })
  });
  if (!res.ok) {
    console.error("predict_series error", res.status, await res.text());
    return;
  }

  const payload = await res.json();
  const probs = Array.isArray(payload.probs) ? payload.probs : [];
  if (!probs.length) return;

  const labels = years.map(String);
  const p1Series = probs.map(p => +(p * 100).toFixed(2));
  const p2Series = p1Series.map(v => +(100 - v).toFixed(2));

  const ctx = document.getElementById('probOverTimeChart').getContext('2d');
  if (probOverTimeChart) probOverTimeChart.destroy();
  probOverTimeChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { 
          label: document.querySelector('input[name="p1"]').value + " Win %", 
          data: p1Series, 
          borderColor: '#2ecc71', 
          backgroundColor: 'rgba(46, 204, 113, 0.1)', 
          tension: 0.2,
          fill: true
        },
        { 
          label: document.querySelector('input[name="p2"]').value + " Win %", 
          data: p2Series, 
          borderColor: '#555555', 
          backgroundColor: 'rgba(85, 85, 85, 0.1)', 
          tension: 0.2,
          fill: true
        }
      ]
    },
    options: {
      scales: {
        y: { beginAtZero: true, max: 100, title: { display: true, text: 'Win Probability (%) — ML' } },
        x: { title: { display: true, text: 'Year' } }
      }
    }
  });
}
</script>

</body>
</html>
