<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis Elo — Comparisons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body data-page="comparisons">
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Home</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('rankings') }}">Rankings</a>
      <a href="{{ url_for('headtohead') }}">Head-to-Head</a>
      <a href="{{ url_for('comparisons') }}">Comparisons</a>
    </nav>
  </header>

  <main class="container center">
    <section class="hero">
      <h1 class="h1">Player Comparisons</h1>
      <p class="muted">Choose two players and a period to compare Elo trends side-by-side.</p>
    </section>

    <section class="card" aria-labelledby="select-heading">
      <h2 id="select-heading" class="h2">Select Players</h2>

      <form class="filters" id="compare-form">
        <label>Player 1
          <input name="p1" list="players" placeholder="e.g., NadalR" autocomplete="off" />
        </label>

        <label>Player 2
          <input name="p2" list="players" placeholder="e.g., NovakJ" autocomplete="off" />
        </label>

        <label>Period
          <select name="period">
            <option value="24m">Last 24 months</option>
            <option value="60m">Last 60 months</option>
            <option value="all">All-time</option>
          </select>
        </label>

        <datalist id="players">
          {% for name in players %}
            <option value="{{ name }}"></option>
          {% endfor %}
        </datalist>

        <button class="btn" type="submit">Compare</button>
      </form>
    </section>

    <section class="grid two">
      <div class="card" id="summary-card">
        <h2 class="h2">Summary</h2>
        <p id="current-elo"><strong>Current Elo:</strong> —</p>
        <p id="sample-size"><strong>Sample size:</strong> —</p>
      </div>

      <div class="card chart-wrap">
        <div style="width:100%;max-width:680px;">
          <h2 class="h2">Elo Over Time</h2>
          <canvas id="compChart" height="240" aria-label="Comparison Elo chart" role="img"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
  let compChart = null;

  function cutoffFromPeriod(period) {
    if (period === 'all') return null;
    const months = period === '24m' ? 24 : 60;
    const dt = new Date();
    dt.setMonth(dt.getMonth() - months);
    return dt.toISOString().slice(0, 10); 
  }

  async function getHistory(player) {
    const res = await fetch(`/get_elo_history?player=${encodeURIComponent(player)}`);
    const data = await res.json();
    if (data.error) throw new Error(`${player}: ${data.error}`);
    return data; 
  }

  // NEW: carry forward Elo for missing dates (flat line)
  function makeSeries(dates, points) {
    const series = [];
    let lastElo = null;

    for (const d of dates) {
      const item = points.find(p => p.date === d);
      if (item) {
        lastElo = item.elo;
        series.push(item.elo);
      } else {
        // Keep last Elo value if no match that day
        series.push(lastElo);
      }
    }

    return series;
  }

  // UPDATED: step-like Elo chart (flat between games)
  function drawChart(labels, s1, s2, p1, p2) {
    const ctx = document.getElementById('compChart').getContext('2d');
    if (compChart) compChart.destroy();
    compChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { 
            label: `${p1} Elo`, 
            data: s1,
            borderWidth: 2,
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.1)',
            stepped: true,
            tension: 0,
            fill: false
          },
          { 
            label: `${p2} Elo`, 
            data: s2,
            borderWidth: 2,
            borderColor: 'rgba(255, 99, 132, 1)',
            backgroundColor: 'rgba(255, 99, 132, 0.1)',
            stepped: true,
            tension: 0,
            fill: false
          }
        ]
      },
      options: {
        interaction: { mode: 'nearest', intersect: false },
        scales: {
          y: { title: { display: true, text: 'Elo Rating' } },
          x: { title: { display: true, text: 'Date' } }
        },
        plugins: {
          legend: { position: 'bottom' }
        }
      }
    });
  }

  document.getElementById('compare-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const p1 = document.querySelector('input[name="p1"]').value.trim();
    const p2 = document.querySelector('input[name="p2"]').value.trim();
    const period = document.querySelector('select[name="period"]').value;

    if (!p1 || !p2) {
      alert('Select both players');
      return;
    }

    try {
      const [d1, d2] = await Promise.all([getHistory(p1), getHistory(p2)]);

      const cutoff = cutoffFromPeriod(period);
      const f1 = cutoff ? d1.filter(pt => pt.date >= cutoff) : d1;
      const f2 = cutoff ? d2.filter(pt => pt.date >= cutoff) : d2;

      const dates = Array.from(new Set([...f1.map(x => x.date), ...f2.map(x => x.date)])).sort();

      const s1 = makeSeries(dates, f1);
      const s2 = makeSeries(dates, f2);

      const curr1 = f1.length ? f1[f1.length - 1].elo : '—';
      const curr2 = f2.length ? f2[f2.length - 1].elo : '—';
      document.getElementById('current-elo').innerHTML =
        `<strong>Current Elo:</strong> ${p1} ${curr1} &nbsp;|&nbsp; ${p2} ${curr2}`;
      document.getElementById('sample-size').innerHTML =
        `<strong>Sample size:</strong> ${s1.filter(v => v != null).length} vs ${s2.filter(v => v != null).length}`;

      drawChart(dates, s1, s2, p1, p2);

    } catch (err) {
      console.error(err);
      alert(err.message || 'Failed to load player histories');
    }
  });
  </script>
</body>
</html>
