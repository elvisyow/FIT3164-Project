<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis Elo — Comparisons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body data-page="comparisons">
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Home</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('rankings') }}">Rankings</a>
      <a href="{{ url_for('headtohead') }}">Head-to-Head</a>
      <a href="{{ url_for('comparisons') }}">Comparisons</a>
    </nav>
  </header>

  <main class="container center">
    <section class="hero">
      <h1 class="h1">Player Comparisons</h1>
      <p class="muted">Choose two players and a period to compare ratings and form side‑by‑side.</p>
    </section>

    <section class="card" aria-labelledby="select-heading">
      <h2 id="select-heading" class="h2">Select Players</h2>
      <form class="filters">
        <label>Player 1
          <input name="p1" list="players" placeholder="e.g., Rafael Nadal" />
        </label>
        <label>Player 2
          <input name="p2" list="players" placeholder="e.g., Novak Djokovic" />
        </label>
        <label>Period
          <select name="period">
            <option value="24m">Last 24 months</option>
            <option value="60m">Last 60 months</option>
            <option value="all">All‑time</option>
          </select>
        </label>
        <datalist id="players">
          <option value="Rafael Nadal"></option>
          <option value="Novak Djokovic"></option>
          <option value="Roger Federer"></option>
          <option value="Jannik Sinner"></option>
          <option value="Carlos Alcaraz"></option>
        </datalist>
        <button class="btn" type="submit">Compare</button>
      </form>
    </section>

    <section class="grid two">
      <div class="card">
        <h2 class="h2">Summary</h2>
        <p><strong>Overall Statistics:</strong> —</p>
        <p><strong>Current Elo:</strong> —</p>
      </div>
      <div class="card chart-wrap">
        <div style="width:100%;max-width:680px;">
          <h2 class="h2">Elo Over Time</h2>
          <canvas id="compChart" height="240" aria-label="Comparison Elo chart" role="img"></canvas>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
