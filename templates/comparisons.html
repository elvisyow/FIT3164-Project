<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis Elo — Comparisons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body data-page="comparisons">
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Home</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('rankings') }}">Rankings</a>
      <a href="{{ url_for('headtohead') }}">Head-to-Head</a>
      <a href="{{ url_for('comparisons') }}" aria-current="page">Comparisons</a>
    </nav>
  </header>

  <main class="container center">
    <section class="hero">
      <h1 class="h1">Compare Elo Trends</h1>
      <p class="muted">Select up to five players and explore their Elo over time. Use the slider to focus on a specific period.</p>
    </section>

    <section class="card" aria-labelledby="select-heading">
      <h2 id="select-heading" class="h2">Select Players (up to 5)</h2>
      <form class="filters" id="compare-form" onsubmit="return false;">
        <label>Player 1
          <input name="p1" list="players" placeholder="e.g. Nadal R." autocomplete="off" />
        </label>
        <label>Player 2
          <input name="p2" list="players" placeholder="e.g. Federer R." autocomplete="off" />
        </label>
        <label>Player 3
          <input name="p3" list="players" placeholder="e.g. Alcaraz C." autocomplete="off" />
        </label>
        <label>Player 4
          <input name="p4" list="players" placeholder="e.g. Sinner J." autocomplete="off" />
        </label>
        <label>Player 5
          <input name="p5" list="players" placeholder="e.g. Murray A." autocomplete="off" />
        </label>

        <datalist id="players">
          {% for name in players %}
            <option value="{{ name }}"></option>
          {% endfor %}
        </datalist>

        <button class="btn" id="plot-btn" type="button">Plot Trends</button>
        <button class="btn" id="clear-btn" type="button" style="background:#ccc; color:#000;">Clear</button>
      </form>

      <div style="margin-top:1rem; max-width:360px; margin-inline:auto; text-align:center;">
        <label for="time-slider" style="display:block; margin-bottom:.35rem;">Timeline Range</label>
        <input type="range" id="time-slider" min="0" max="100" value="100" style="width:100%;">
      </div>
    </section>

    <section class="card chart-wrap" aria-labelledby="chart-heading">
      <h2 id="chart-heading" class="h2">Elo Over Time</h2>
      <canvas id="compChart" height="280" aria-label="Comparison Elo chart" role="img"></canvas>
      <p class="muted" id="summary" style="margin-top:.75rem;"></p>
    </section>
  </main>

<script>
let compChart = null;
let seriesStore = [];
let allDates = [];

// -------- Helpers --------
async function getHistory(player) {
  const res = await fetch(`/get_elo_history?player=${encodeURIComponent(player)}`);
  const data = await res.json();
  if (data.error) throw new Error(`${player}: ${data.error}`);
  return data;
}

function makeSeriesForDates(dates, points) {
  let last = null;
  const map = new Map(points.map(p => [p.date, p.elo]));
  return dates.map(d => {
    if (map.has(d)) last = map.get(d);
    return last;
  });
}

function visibleDatesByPercent(percent) {
  if (!allDates.length) return [];
  const count = Math.max(1, Math.floor(allDates.length * (percent / 100)));
  return allDates.slice(-count);
}

function buildAllDates() {
  const set = new Set();
  for (const s of seriesStore) for (const p of s.points) set.add(p.date);
  allDates = Array.from(set).sort();
}

function drawChart(visibleDates) {
  const ctx = document.getElementById('compChart').getContext('2d');
  if (compChart) compChart.destroy();

  const colors = [
  { borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)' },  // Red
  { borderColor: '#1e90ff', backgroundColor: 'rgba(30, 144, 255, 0.1)' }, // Blue
  { borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)' }, // Lime green
  { borderColor: '#f1c40f', backgroundColor: 'rgba(241, 196, 15, 0.1)' }, // Yellow
  { borderColor: '#a8a8ad', backgroundColor: 'rgba(168, 168, 173, 0.2)' } // Neutral grey
];


  const datasets = seriesStore.map((s, i) => {
    const c = colors[i % colors.length];
    return {
      label: s.name,
      data: makeSeriesForDates(visibleDates, s.points),
      tension: 0.2,
      spanGaps: true,
      borderColor: c.borderColor,
      backgroundColor: c.backgroundColor,
      borderWidth: 2
    };
  });

  compChart = new Chart(ctx, {
    type: 'line',
    data: { labels: visibleDates, datasets },
    options: {
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: c => c.parsed.y != null ? `${c.dataset.label}: ${c.parsed.y}` : null } }
      },
      scales: {
        y: { title: { display: true, text: 'Elo Rating' } },
        x: { title: { display: true, text: 'Date' } }
      }
    }
  });
}

function updateSummary(visibleDates) {
  const el = document.getElementById('summary');
  if (!el) return;
  if (!seriesStore.length || !visibleDates.length) { el.textContent = ''; return; }

  const bits = seriesStore.map(s => {
    const vis = s.points.filter(p => p.date >= visibleDates[0] && p.date <= visibleDates[visibleDates.length - 1]);
    const curr = vis.length ? vis[vis.length - 1].elo : null;
    return `${s.name}: ${curr != null ? Math.round(curr) : '—'}`;
  });
  el.textContent = `Latest Elo in view — ${bits.join('  •  ')}`;
}

function setSliderLabel(percent) {
  const el = document.getElementById('slider-label');
  if (el) el.textContent = `Showing ${percent}% of timeline`;
}

// -------- Main flow --------
async function plotFromInputs() {
  const names = ['p1','p2','p3','p4','p5']
    .map(n => document.querySelector(`input[name="${n}"]`)?.value.trim())
    .filter(Boolean);

  const uniq = [];
  const seen = new Set();
  for (const n of names) {
    const k = n.toLowerCase();
    if (!seen.has(k)) { seen.add(k); uniq.push(n); }
  }

  if (uniq.length < 2) { alert('Please enter at least 2 players (up to 5).'); return; }
  if (uniq.length > 5) { alert('Max 5 players.'); return; }

  try {
    const histories = await Promise.all(uniq.map(n => getHistory(n)));
    seriesStore = uniq.map((name, i) => ({ name, points: histories[i] || [] }));
    buildAllDates();

    const percent = Number(document.getElementById('time-slider').value || 100);
    const visDates = visibleDatesByPercent(percent);
    drawChart(visDates);
    updateSummary(visDates);
    setSliderLabel(percent);
  } catch (err) {
    console.error(err);
    alert(err.message || 'Failed to load player histories');
  }
}

function clearComparisons() {
  seriesStore = [];
  allDates = [];

  ['p1','p2','p3','p4','p5'].forEach(n => {
    const input = document.querySelector(`input[name="${n}"]`);
    if (input) input.value = '';
  });

  const slider = document.getElementById('time-slider');
  if (slider) {
    slider.value = 100;
    setSliderLabel(100);
  }

  if (compChart) {
    compChart.destroy();
    compChart = null;
  }

  const summary = document.getElementById('summary');
  if (summary) summary.textContent = '';
}

document.getElementById('plot-btn')?.addEventListener('click', plotFromInputs);
document.getElementById('clear-btn')?.addEventListener('click', clearComparisons);

document.getElementById('time-slider')?.addEventListener('input', (e) => {
  const percent = Number(e.target.value);
  if (!allDates.length || !seriesStore.length) { setSliderLabel(percent); return; }
  const visDates = visibleDatesByPercent(percent);
  drawChart(visDates);
  updateSummary(visDates);
  setSliderLabel(percent);
});

window.addEventListener('DOMContentLoaded', () => {
  const qs = new URLSearchParams(location.search);
  const keys = ['p1','p2','p3','p4','p5'];
  let filled = 0;
  keys.forEach(k => {
    const v = qs.get(k);
    if (v) {
      const input = document.querySelector(`input[name="${k}"]`);
      if (input) { input.value = v; filled++; }
    }
  });
  if (filled >= 2) plotFromInputs();
});
</script>
</body>
</html>
