            <div class="rank">#1</div>
            <div class="name">Novak Djokovic</div>
            <div class="elo">SRB • Elo 2360</div>
          </div>
        </div>

        <div class="step bronze" style="height:140px">
          <div class="step-inner">
            <div class="rank">#3</div>
            <div class="name">Jannik Sinner</div>
            <div class="elo">ITA • Elo 2290</div>
          </div>
        </div>
