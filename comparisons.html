<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tennis ELO — Comparisons</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="comparisons">
  <header class="site-header">
    <a class="brand" href="homepage.html"> Home </a>
    <nav class="nav">
      <a href="rankings.html">Rankings</a>
      <a aria-current="page" href="headtohead.html">Head‑to‑Head</a>
      <a href="comparisons.html">Comparisons</a>
    </nav>
  </header>

  <main>
    <h1>Player Comparisons</h1>
    <p>Compare two tennis players statistics</p>

    <section aria-labelledby="select-heading">
      <h2 id="select-heading">Select Players</h2>
      <form>
        <label>
          Player 1:
          <input name="p1" list="players" placeholder="e.g., Rafael Nadal" />
        </label>
        <br />
        <label>
          Player 2:
          <input name="p2" list="players" placeholder="e.g., Novak Djokovic" />
        </label>
        <br />
        <label>
          Surface:
          <select name="surface">
            <option value="all">All</option>
            <option value="hard">Hard</option>
            <option value="clay">Clay</option>
            <option value="grass">Grass</option>
          </select>
        </label>
        <br />
        <label>
          Period:
          <select name="period">
            <option value="24m">Last 24 months</option>
            <option value="60m">Last 60 months</option>
            <option value="all">All-time</option>
          </select>
        </label>
        <datalist id="players">
          <option value="Rafael Nadal"></option>
          <option value="Novak Djokovic"></option>
          <option value="Roger Federer"></option>
          <option value="Jannik Sinner"></option>
          <option value="Carlos Alcaraz"></option>
        </datalist>
      </form>
    </section>

    <section aria-labelledby="h2h-heading">
      <h2 id="h2h-heading">Statistics</h2>
      <p><strong>Overall Statistics:</strong> —</p>
      <p><strong>Current Elo:</strong> —</p>
    </section>

    <section aria-labelledby="elo-time-heading">
      <h2 id="elo-time-heading">Elo Over Time</h2>
      <figure>
        <img src="assets/placeholders/elo-over-time.png" alt="Placeholder for Elo over time chart" />
        <figcaption>placeholder — to be replaced with a real chart</figcaption>
      </figure>
    </section>

    <section aria-labelledby="surface-breakdown-heading">
      <h2 id="surface-breakdown-heading">Surface Breakdown</h2>
      <figure>
        <img src="assets/placeholders/surface-breakdown.png" alt="Placeholder for surface breakdown chart" />
        <figcaption>placeholder — to be replaced with a real chart</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
